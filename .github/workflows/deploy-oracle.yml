name: Deploy Oracle ARM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'ingest.py'
      - 'requirements.txt'
      - 'scripts/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deshabilitado hasta que existan los secretos de la VM Oracle.
    if: ${{ secrets.ORACLE_SSH_PRIVATE_KEY != '' && secrets.ORACLE_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync code to Oracle VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          source: "app,src,ingest.py,requirements.txt,scripts,.env.example"
          target: "/home/${{ secrets.ORACLE_USER }}/lebowski-rag"

      - name: Provision / restart on Oracle VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          envs: ORACLE_DOMAIN,DUCKDNS_TOKEN
          script: |
            [ -f .env ] || cp /home/${{ secrets.ORACLE_USER }}/lebowski-rag/.env.example /home/${{ secrets.ORACLE_USER }}/lebowski-rag/.env
            bash /home/${{ secrets.ORACLE_USER }}/lebowski-rag/scripts/deploy_oracle.sh
