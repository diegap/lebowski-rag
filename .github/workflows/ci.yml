name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile src/pdf_loader.py app/main.py app/rag.py app/ui.py ingest.py

      - name: Smoke test (parser, no Ollama ni PDF)
        run: |
          python - <<'EOF'
          from src.pdf_loader import parse_layout

          FIXTURE = "\n".join([
              "EXT. CALIFORNIA DESERT - DAY",
              "We float up a steep scrubby slope.",
              "                         VOICE-OVER",
              "            A way out west there was this fella.",
              "INT. DUDE'S BUNGALOW - CONTINUOUS",
              "His head is plunged into the toilet.",
              "                         DUDE",
              "            Nobody calls me Lebowski. I'm the Dude, man.",
              "                         BLOND MAN",
              "            See, you see what happens, Lebowski?",
          ])

          turns = parse_layout([FIXTURE])
          assert len(turns) == 3, turns
          assert turns[0].character == "VOICE-OVER"
          assert turns[1].character == "DUDE" and turns[1].speaker_is_dude
          assert turns[1].scene == turns[2].scene == 2
          assert "golfer" not in " ".join(t.text for t in turns)
          print(f"smoke ok ({len(turns)} turnos)")
          EOF
